name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim: ["2.0.x", "2.2.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install terminal_style from GitHub
        working-directory: ${{ runner.temp }}
        run: nimble install https://github.com/titanomachy/terminal-style -y
      - run: nimble check
      - run: nimble test -y
      - run: nimble examples -y
      - if: matrix.os == 'ubuntu-latest' && matrix.nim == 'stable'
        run: nimble docs -y

  coverage:
    name: Coverage / Nim stable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install terminal_style from GitHub
        working-directory: ${{ runner.temp }}
        run: nimble install https://github.com/titanomachy/terminal-style -y
      - name: Install coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
      - name: Run tests with coverage instrumentation
        shell: bash
        run: |
          mkdir -p build/coverage
          for test_file in \
            tests/test_core.nim \
            tests/test_trees.nim \
            tests/test_panels.nim \
            tests/test_lists.nim \
            tests/test_callouts.nim \
            tests/test_banners.nim \
            tests/test_composition.nim \
            tests/test_release_contract.nim
          do
            test_name="$(basename "$test_file" .nim)"
            nim c -r \
              --path:src \
              --debugger:native \
              --passC:--coverage \
              --passL:--coverage \
              --nimcache:"build/nimcache/coverage/$test_name" \
              --out:"build/coverage/$test_name" \
              "$test_file"
          done
      - name: Generate LCOV report
        run: |
          lcov \
            --capture \
            --directory build/nimcache/coverage \
            --output-file coverage.info \
            --ignore-errors inconsistent,mismatch
          lcov \
            --extract coverage.info \
            "$GITHUB_WORKSPACE/src/*" \
            --output-file coverage.info \
            --ignore-errors inconsistent,unused
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
